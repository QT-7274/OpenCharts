feature:
  name: crypto-ai-analysis
  product: opencharts
  description: 基于真实加密货币现货行情的多周期技术分析、条件式入场计划、AI 解释和模拟交易能力。

components:
  MARKET_DATA:
    requirements:
      1: 第一版必须使用 Binance Spot 公共市场数据获取现货 K 线，不要求用户提供 API key。
      1-1: 历史 K 线通过 REST 获取，实时 K 线通过 WebSocket 获取。
      1-2: 第一版必须保留可替换的数据 adapter，以便未来接入后端代理、缓存或其他行情源。
      2: 第一版支持 BTCUSDT、ETHUSDT、SOLUSDT、BNBUSDT、XRPUSDT、ADAUSDT，以及 1h、4h、1d 周期。
      3: 行情 adapter 必须将 REST 数组和 WebSocket 事件转换为统一的现货 K 线模型。
      3-1: 内部时间统一使用 UTC Unix epoch milliseconds，页面时区不得改变分析结果。
      3-2: K 线模型必须保留 symbol、interval、openTimeMs、closeTimeMs、OHLCV、tradeCount、isClosed 和 source。
      4: WebSocket adapter 必须支持重连、恢复订阅、连接状态、消息新鲜度和断线后的 REST 尾部回填。
      5: 行情数据必须按 symbol、interval、openTimeMs 去重和 upsert，且闭合 K 线优先于未闭合版本。
      6: 发现缺口时必须优先 REST 回填，不能使用 OHLCV 前值填充、插值或伪造成交量。
      7: 现价报价必须保存 Binance 最新成交时间和服务端时间，报价年龄超过 30 秒时不得用于生成或更新入场计划。

  CANDLE_QUALITY:
    requirements:
      1: 系统必须支持用户手动触发分析和 1h K 线闭合后的自动触发。
      1-1: 同一 symbol 和 1h openTimeMs 的闭合事件最多生成一次正式分析快照。
      2: 未闭合 K 线只能用于实时展示，不得进入正式指标、信号、入场计划或自动分析输入。
      3: 分析必须按 analysisTimeMs 对齐 1d、4h、1h 数据，并为每个周期选择该时间点之前最近的已闭合 K 线。
      3-1: 自动触发的 analysisTimeMs 使用刚闭合 1h K 线的 closeTimeMs，手动触发使用 Binance server time。
      3-2: 分析快照必须保存触发类型、analysisTimeMs 和各周期实际 candleCloseTime。
      4: 正式分析前必须校验时间、OHLCV 有限性、价格和成交量范围、high/low 关系、周期边界、缺口和指标暖机数量。
      5: 缺口、数据冲突、数据过期或指标暖机不足无法修复时，系统必须返回 insufficient-data 并禁止生成交易信号。
      5-1: insufficient-data 的用户结论必须是“暂不入场”，并说明缺失周期或数据时间。

  STRATEGY:
    requirements:
      1: 策略必须使用 1d、4h、1h 多周期趋势和回调确认，只生成现货做多计划，不生成做空计划。
      2: 1d 多头趋势必须同时满足 close > EMA200、EMA50 > EMA200 且 EMA50 高于 5 根 K 线前的 EMA50。
      3: 4h 多头趋势必须同时满足 close > EMA50、EMA20 > EMA50 且 EMA20 高于 3 根 K 线前的 EMA20。
      4: 只有 1d 和 4h 同时满足多头趋势时，系统才允许寻找做多回调。
      5: 有效 4h 回调必须在最近 6 根已闭合 4h K 线中进入 EMA20 与 EMA50 动态区域，区域边界额外放宽 0.25 ATR(14)。
      5-1: 回调期间 4h close 不得低于 EMA50 - 0.5 ATR(14)，否则当前 setup 失效。
      5-2: 未触及回调区域时不得追涨，必须等待新的回调 setup。
      6: 有效回调后，1h 入场确认必须满足 EMA20 reclaim 或突破前 3 根 1h K 线最高价、当前 K 线 close > open、RSI(14) >= 50 且高于上一根。
      7: MACD histogram 上升和成交量高于 Volume SMA(20)作为评分加分项，不作为 1h 入场硬门槛。
      8: 策略状态必须至少区分 watch、setup、enter 和 avoid，并为 avoid 提供可追踪原因。
      9: 策略必须生成 0 到 100 的证据评分，其中日线与 4 小时趋势质量占 30 分、4 小时回调质量占 20 分、1 小时价格确认占 20 分、RSI 与 MACD 动量占 15 分、成交量确认占 10 分、波动率与数据新鲜度占 5 分。
      9-1: 评分不得绕过数据完整性、趋势、回调结构、1 小时确认和风险收益比等硬性条件。
      10: 只有硬性条件全部满足、总分至少 70、风险收益比至少 1:2 且数据无未解决冲突时，策略才可进入 enter。
      11: 状态决策必须按数据异常、趋势不合格、回调失效、尚无回调、等待 1 小时确认、评分或风险收益比不足、全部达标的顺序应用确定性优先级。
      11-1: 数据异常、趋势不合格或回调失效必须进入 avoid；尚无回调进入 watch；已有回调但未确认进入 setup；确认后评分或风险收益比不足进入 avoid；全部达标进入 enter。
      12: 第一版策略配置版本必须标记为 trend-pullback-v1，分析快照和回测结果必须保存完整策略版本。
      12-1: 修改指标参数、评分权重或门槛时必须创建新策略版本，不能改变旧结果所引用版本的含义。
      13: 趋势质量的 30 分必须由 1d 和 4h 各三个趋势条件组成，每个满足的条件计 5 分。
      14: 4h 回调质量的 20 分必须由进入回调区 8 分、未跌破失效线 6 分、最新 4h close >= EMA20 计 6 分组成。
      15: 1h 价格确认的 20 分必须由 EMA20 reclaim 或突破前 3 根最高价计 10 分、阳线计 5 分、两种价格触发同时满足再计 5 分组成。
      16: 动量的 15 分必须由 RSI(14) >= 50、RSI 高于上一根、MACD histogram 高于上一根各计 5 分组成。
      17: 成交量高于 Volume SMA(20)时计 10 分，否则成交量维度计 0 分。
      18: 三个周期数据均及时计 3 分，1h ATR(14) / close 位于 0.3% 到 3% 之间计 2 分。

  ENTRY_PLAN:
    requirements:
      1: 支撑阻力必须从最近 60 根已闭合 4h K 线中识别，候选低点低于前后各 2 根时形成候选支撑，候选高点高于前后各 2 根时形成候选阻力。
      1-1: 局部高低点只能在其后 2 根 4h K 线均已闭合后确认，不能使用 analysisTimeMs 之后的数据。
      1-2: 距离不超过当前 0.5 倍 4h ATR(14) 的候选价位必须合并为同一区域，优先选择距离当前价格最近的区域，并依次以触及次数和最近触及时间打破并列。
      2: 1h 确认完成后，参考入场价必须取确认 K 线 close，入场区间下沿取 max(1h EMA20, 参考入场价 - 0.25 倍 1h ATR(14))，上沿取参考入场价 + 0.10 倍 1h ATR(14)。
      2-1: 实时价格高于入场区间上沿时不得追涨，计划保持 setup 并等待回到区间，最多保留 3 根已闭合 1h K 线。
      3: 结构止损必须位于最近有效回调最低价下方 0.25 倍 4h ATR(14)，波动止损必须位于参考入场价下方 1.5 倍 1h ATR(14)，最终止损取两者中更低的价格。
      3-1: 当最终止损导致模拟仓位无法满足净值 1% 风险边界时，计划必须进入 avoid。
      4: 以参考入场价到最终止损的距离定义 1R，TP1 必须等于参考入场价 + 2R。
      4-1: 最近上方有效阻力低于 TP1 时计划必须进入 avoid；阻力不低于 TP1 时 TP2 取该阻力；不存在有效上方阻力时 TP2 取参考入场价 + 3R。
      4-2: 第一版只输出止盈计划，不自动移动止损或执行卖出。
      5: 未成交计划在超过 3 根已闭合 1h K 线、1d 或 4h 多头条件失效、4h 回调结构失效、1h close 跌破回调最低价或行情变为 insufficient-data 时必须取消。
      5-1: 价格高于入场区间上沿本身不取消计划，只禁止追涨并受 3 根 1h K 线有效期约束。
      6: 刷新页面后必须恢复未过期且未失效的入场计划，过期或已失效计划不得恢复为活动计划。

  ANALYSIS_OUTPUT:
    requirements:
      1: 分析结果必须包含趋势方向、指标证据、支撑阻力、入场区间、失效条件、止损、止盈、风险收益比和置信度。
      2: 指标冲突、数据不足、结构失效或风险收益比不达标时，分析结果必须为“暂不入场”。
      3: 所有交易相关数值必须由可复现的确定性算法产生，不能由 AI 自由发挥或覆盖。
      4: 置信度必须表达当前策略证据完整度，不能表达上涨概率、胜率或预期收益。
      4-1: 评分 80 到 100 显示为高置信度，70 到 79 显示为中置信度，低于 70 显示为低置信度并禁止入场。

  AI_EXPLANATION:
    requirements:
      1: AI 只能基于算法生成的指标、状态、价位和风险参数生成自然语言解释。
      2: AI 不得修改算法数值、添加算法未产生的交易信号或补全缺失行情。
      3: 前端必须只调用项目后端的 AI explanation endpoint，AI provider secret 只能存在于后端环境变量中。
      3-1: 后端必须通过可替换的 AiExplanationProvider 调用模型，第一版使用 OpenAI Responses API，但模型 ID 必须可配置并写入快照。
      4: AI 输入只能包含 symbol、analysisTimeMs、trigger、strategyVersion、三个周期的数据时间、指标结果、评分细目、策略状态与原因、支撑阻力、入场与风险计划以及数据质量状态。
      4-1: AI 输入不得包含整段原始 K 线历史，模型不得使用联网搜索、工具调用或其他行情源补充分析。
      5: AI 必须通过 strict Structured Outputs 返回 summary、trendExplanation、indicatorEvidence、entryExplanation、riskExplanation、cautionNotes 和 educationalNotes，schema 必须拒绝额外字段并限制文本长度和数组条数。
      5-1: AI 输出只能包含解释性文字，策略状态、评分、置信度、支撑阻力、入场区间、止损止盈和风险收益比必须直接使用算法结果展示。
      6: 后端必须校验 AI 输出中的价格、百分比和评分；出现输入中不存在或与算法结果不一致的数字时，整份 AI 解释必须标记为 invalid，不能部分展示。
      6-1: 界面必须区分“策略计算”和“AI 解释”，不能将 AI 文字显示为算法事实。
      6-2: AI 解释中明确关联入场、支撑阻力、止损止盈、指标、评分或风险收益比的数字必须与同类算法字段一致；恢复历史时必须复验，校验失败的解释不得展示。
      7: 算法状态不是 enter 时，AI 只能解释等待或回避原因，不得提供替代入场价、建议绕过硬条件或暗示激进入场。
      8: AI 请求超时、网络失败、模型拒答、响应不完整、schema 校验失败或数字校验失败时最多重试一次，整个操作总超时为 15 秒。
      8-1: AI 失败时必须保留并展示算法结果，AI 区域显示“AI 解释暂不可用”，不得复用旧解释冒充本次输出，也不得改变策略状态。
      9: 相同 symbol、analysisTimeMs、strategyVersion 和 promptVersion 的分析默认只能产生一次 AI 调用，重复手动分析必须复用已保存解释。
      9-1: 只有用户明确执行“重新生成解释”时才能再次调用；自动 AI 调用每日软上限默认 50 次，达到上限后停止自动解释但继续算法分析。
      9-2: 单次 AI 调用的 max_output_tokens 默认不超过 1000。
      10: 自动解释每日调用计数必须跨后端重启保留；本地限额状态只保存 UTC 日期和调用次数。

  ANALYSIS_SNAPSHOT:
    requirements:
      1: 每次分析必须保存算法输入摘要、算法结果、strategyVersion、promptVersion、schemaVersion、AI provider、完整 model ID、请求与响应时间、token usage、AI 原始结构化响应、校验结果和失败原因。
      1-1: 快照不得保存 AI provider secret、交易所 secret 或其他认证凭据。
      2: OpenAI 请求必须设置 store 为 false，本地分析快照默认长期保留，直到用户主动删除。
      3: 每份展示的 AI 解释必须能够追溯到同一快照中的算法结果、输入摘要和模型元数据。
      4: 恢复本地分析历史时必须逐条校验记录；无效记录不得恢复，且不得阻止其他有效记录恢复。
      5: 分析快照或 AI 解释写入本地存储失败时必须明确提示未能保存，不得静默视为已保存。

  RISK_AND_PAPER_TRADING:
    requirements:
      1: 第一版只能进行模拟交易，不得连接真实券商、真实账户或自动提交订单。
      2: 默认单笔模拟交易风险不得超过净值的 1%。
      3: 止损必须结合 ATR 和结构位计算，最低风险收益比必须达到 1:2，否则不得进入 enter 状态。
      4: 模拟订单只能由用户基于分析结果主动创建或确认，不得由 AI 自动提交。
      5: 风险金额必须等于当前模拟净值的 1%，理论数量必须等于风险金额除以计划入场价与止损价之差。
      5-1: 实际数量必须取理论数量与可用 USDT 可购买数量中的较小值，再按交易对数量精度向下取整并重新计算实际风险；资金不足时只能缩小仓位，不能放宽止损。
      5-2: 模拟账户不得借款、产生负余额或使用杠杆。
      6: enter 状态必须提供“带入模拟订单”操作，自动填入交易对、限价入场区间、参考价、风险计算数量、止损、TP1、TP2、strategyVersion 和 snapshotId。
      6-1: 带入操作只能填充订单表单，不能提交订单；用户必须通过独立确认操作创建模拟订单。
      7: 状态不是 enter、计划过期、行情 insufficient-data 或 degraded、风险收益比低于 1:2、止损不低于入场价、数量价格或风险非法时，系统必须禁止带入和提交模拟订单。
      7-1: 单笔风险超过 1%、组合风险超过 3%、可用 USDT 不足、同币种已有未平仓仓位或策略回测状态为 invalid 时，系统必须禁止带入和提交模拟订单。
      8: 提交模拟订单前必须显示二次确认，列出模拟订单性质、计划入场、数量、最大风险金额与净值占比、止损、TP1、TP2、预计手续费与滑点、回测状态和计划剩余有效时间。
      9: 回测状态为 experimental 且不为 invalid 时允许继续模拟交易，但每次提交都必须显示不可关闭的“策略尚未通过研究可用门槛”提示，并将该回测状态保存到交易记录。
      10: 看跌或多头趋势不合格时必须输出 avoid 和“暂不入场，等待多头条件重新建立”，不得生成做空入场价、做空止损或做空止盈。
      10-1: 看跌状态可以展示下方支撑位作为观察信息，但不能将其表达为做空目标。
      11: 创建模拟订单时必须复制不可变的分析计划，并永久引用创建时的 snapshotId、strategyVersion 和回测状态；后续分析不得修改已有订单。
      11-1: 原计划在成交前失效时必须自动取消未成交挂单并记录原因；已经成交的仓位继续按创建时的止损止盈管理，不得被新分析或 AI 自动修改。
      12: 加密货币模拟账户必须与现有交易终端账户隔离，使用独立余额、订单、持仓和交易记录，默认初始净值为 10000 USDT。
      12-1: 带入模拟订单只预填独立模拟订单表单，只有用户明确确认后才创建订单。
      12-2: 模拟订单必须引用不可变分析快照、策略版本和回测状态；每个币种最多一个未成交订单或未平仓仓位。
      12-3: 模拟订单、持仓和成交记录必须跨页面刷新恢复，存储失败时必须显示错误且禁止将操作标记为已保存。

  VALIDATION:
    requirements:
      1: 第一版必须提供基础历史回测，用于验证策略信号、手续费、滑点、信号延迟和指标暖机边界。
      2: 回测和实时分析都必须避免使用未来数据。
      3: 第一版必须支持保存分析快照，快照能够复现当时的行情时间、指标输入、策略状态和 AI 解释输入。
      4: 回测必须分别覆盖首批 6 个交易对最近完整的 3 年；交易对历史不足 3 年时使用 Binance 可获得的全部历史，并同时提供单币种结果和 6 币种组合汇总。
      4-1: 正式统计开始前必须至少加载额外 250 根 1d K 线及对应低周期数据用于指标暖机，暖机期间产生的信号和收益不得计入报告。
      5: 每个回测区间必须按时间顺序将前 70% 作为研究区间、后 30% 作为样本外验证区间，不能随机切分。
      5-1: trend-pullback-v1 参数确定后不得根据其样本外结果改写 v1；任何调参必须创建新策略版本并重新执行完整切分验证。
      6: 1h 确认信号只能在该 K 线闭合后可见，入场计划最早从下一根 1h K 线开始生效，不得以确认 K 线内部的价格成交。
      6-1: 后续 1h K 线价格范围触及入场区间时视为成交；同一根 K 线同时触及入场与止损时按先成交后止损处理，同时触及止损与止盈时按止损优先处理。
      7: 回测默认买入和卖出手续费各为 0.1%，买入和卖出滑点各为 0.05%，所有成本必须可配置且向交易不利方向应用。
      7-1: 收益、风险和净值指标必须基于扣除手续费与滑点后的模拟成交结果，报告必须同时保留理论计划价和实际模拟成交价。
      8: 回测默认初始净值为 10000 USDT，每笔仓位风险不得超过当时净值的 1%，组合同时承担的总风险不得超过当时净值的 3%。
      8-1: 同一交易对同时最多持有一个未平仓仓位，6 个交易对可以并行持仓；达到组合风险上限后按信号时间顺序跳过后续信号并记录原因。
      9: 模拟仓位触发 TP1 时必须卖出 50%，并将剩余 50% 的止损移动到包含交易成本的保本价；剩余仓位在 TP2 或保本止损触发时退出。
      9-1: 同一根 1h K 线同时触及移动后的止损和 TP2 时必须按止损优先处理；第一版不得使用追踪止损或由 AI 决定退出。
      10: 回测报告必须按单币种和 6 币种组合显示信号数、成交数、跳过数及原因、胜率、净收益率、年化收益率、Profit Factor、最大回撤、平均每笔净收益、平均持仓时间、平均实际风险收益比、交易成本、最大连续亏损次数和各策略状态数量。
      11: 单币种样本外区间至少需要 20 笔成交，6 币种组合样本外区间至少需要 100 笔成交，才能标记为样本足够。
      11-1: 样本不足时仍可展示结果，但必须标记“样本不足”，且不能据此声明策略有效或无效。
      12: 回测必须提供各币种同期 buy-and-hold 和 6 币种等权 buy-and-hold 基准，并比较净收益、最大回撤和风险调整收益。
      12-1: research-usable 不要求策略收益高于 buy-and-hold，但报告必须明确展示差异。
      13: 样本外组合只有在至少 100 笔成交、Profit Factor >= 1.1、最大回撤 <= 25%、扣除全部成本后净收益为正、至少 4 个币种 Profit Factor >= 1.0 且所有未来数据与成交时序测试通过时，才能标记为 research-usable。
      13-1: 未满足 research-usable 条件时必须标记为 experimental；research-usable 只表示适合继续模拟研究，不表示适合真实交易或保证未来收益。
      14: 自动化测试必须证明每次分析只读取 analysisTimeMs 之前已闭合的数据，局部高低点只在后两根 4h K 线闭合后确认，指标暖机数据不产生统计期交易，且信号确认 K 线不能提供更早成交价格。
      14-1: 自动化测试必须证明修改未来 K 线不会改变更早分析快照，并且相同数据和策略版本的重复回测结果完全一致；任一测试失败时该回测必须标记为 invalid。
      14-2: 回测报告的有效性检查必须来自实际输入与执行结果；任一检查未通过时状态必须为 invalid，不能固定报告检查通过。
      15: 回测报告必须提供至少 3 个连续、按时间递增的滚动样本外窗口，并分别显示每个窗口的成交数、净收益、Profit Factor、最大回撤和 Sharpe。
      15-1: 每个滚动样本外窗口的训练区间必须严格早于测试区间；窗口之间不得重叠，样本不足必须显式标记。
      15-2: 滚动测试使用固定策略版本，不得根据任何滚动样本外结果自动修改参数或选择策略。
      15-3: 滚动窗口首根可成交 K 线必须保留由窗口开始前信号产生且在窗口开始前已确认的有效计划，不得因测试窗口裁切漏掉其成交。
      16: 回测报告必须按交易发生时可见的 BTC 日线 EMA50 与 EMA200 将成交分为牛市、震荡或熊市，并报告每类的样本数、净盈亏、胜率和 Profit Factor。
      16-1: 市场阶段只能使用交易时点之前已闭合的 BTC 日线数据；缺少基准数据时必须标记为未知，不得推断阶段。
      17: 参数敏感性报告必须只在研究区间比较 65、70、75 三种入场评分门槛，并单独显示每种参数变体的策略版本、成交数、净收益、Profit Factor 和最大回撤。
      17-1: 参数变体必须使用独立版本标识；原 trend-pullback-v1 定义和既有结果不可被变体覆盖，样本外结果不得用于挑选或回写参数。
      18: 本地研究服务必须能够生成并持久化完整回测报告，报告至少包含策略版本、成本假设、有效性检查、请求区间、生成时间和单币种及组合结果。
      18-1: 服务重启后必须能够读取最近一次完整回测报告；不存在报告或报告无法通过有效性检查时，前向模拟必须保持不可创建订单状态。

  FORWARD_SIMULATION:
    requirements:
      1: 前向模拟必须只使用实际收到且已闭合的 Binance Spot K 线，不得读取未闭合 K 线或未来数据。
      1-1: 对历史补齐 K 线生成分析时，只能使用该 K 线收盘时已知的价格，不得使用后续实时现价判断计划状态。
      2: 每次信号、模拟挂单、成交、取消、止损、止盈和数据恢复都必须记录 UTC 时间、交易对、快照 ID、策略版本、成交价、手续费和滑点。
      3: 模拟挂单必须按后续闭合 1h K 线的价格范围成交，且同一根 K 线同时触发多个退出条件时遵循回测的止损优先规则。
      4: 前向模拟必须跨应用重启恢复订单、持仓、净值和事件日志；恢复时先补齐缺失闭合行情，未完成补齐前暂停新的成交判断。
      4-1: 补齐历史 K 线时，分析只能使用该 K 线及其之前已闭合的数据；分析失败必须保留可重试状态，不得因行情检查点前进而跳过分析。
      5: 前向模拟必须展示模拟成交手续费与滑点相对回测假设的偏差，并明确成本按模拟费率计算，不能代表真实成交实测值；不得根据前向结果自动调整策略参数。
      5-1: 成本比较必须展示所用费率假设和模拟成本；没有真实订单时不得将模型成本或差值描述为实测费用或真实滑点。
      6: 数据中断、补齐失败、存储失败或处理异常必须形成可查看的运行事件，并暂停受影响交易对的模拟成交。
      7: 前向模拟运行器必须作为独立服务进程运行，不依赖浏览器页面保持打开。
      8: 模拟账户状态与挂单操作必须由本机运行器持久化处理，浏览器关闭或刷新不得中断行情处理。
      9: 运行器状态接口必须提供行情连接、最后行情时间、最后成功处理时间、暂停原因和存储错误。
      10: 前向模拟只有在行情连接 live、行情消息新鲜、账本存储正常且恢复行情处理完成时，才允许预填或确认新模拟订单；服务端必须在两个操作时分别校验。
      10-1: 订单接口只接受快照标识；服务端必须从自身持久化分析记录解析快照和策略版本，并使用服务端保存的最新回测状态，拒绝未知、过期或状态不匹配的引用。
      11: 模拟面板必须展示最后行情时间、最后成功处理时间、暂停原因、存储状态，以及模拟成交手续费和滑点相对回测费率假设的偏差。
      11-1: 前向模拟状态接口必须展示服务端持久化回测状态及其更新时间，不能只依赖浏览器内存或 localStorage 状态。

constraints:
  DATA_BOUNDARY:
    description: 公共行情可以在本地研究版由浏览器直连，密钥、AI provider、用户数据、真实交易和多用户共享缓存必须经过后端代理。
    requirements:
      1: 前端不得保存或传输任何交易所 API secret 或 AI provider secret。
      2: 行情 adapter 必须支持注入 REST 和 WebSocket base URL，不能把浏览器直连实现扩散到业务层。
  SCOPE:
    description: 首版定位为个人研究工具，不承诺预测收益或提供投资建议。
    requirements:
      1: 首版不支持永续合约、杠杆、资金费率、持仓量、强平分析、真实订单或自动交易。
      2: 首版不把截图识别作为主要分析路径。
      3: 系统必须将分析结果展示为研究和模拟交易信息，而不是确定性收益承诺。

  RELIABILITY:
    description: 前向模拟与模拟账户必须可恢复、可审计，任何运行故障不得伪造成交或静默丢失状态。
    requirements:
      1: 重连后必须从最后确认处理的闭合 K 线开始补齐行情，并按时间顺序幂等处理重复数据。
      1-1: 模拟成交与分析处理必须有可分别恢复的检查点；分析失败后重试不得重复记账已处理的成交，也不得跳过失败分析。
      1-2: 行情缺口超过交易所单次查询上限时必须分批补齐；任一批缺失或不连续时必须暂停相关交易对且不得推进完整恢复状态。
      2: 运行事件日志必须限制敏感信息，不得记录认证凭据或 AI provider secret。
      3: 关键运行状态必须包含最后行情时间、最后成功处理时间、暂停原因和存储状态。
      4: 本地前向模拟 HTTP 接口必须只绑定 loopback 地址，不得监听公网网卡。
