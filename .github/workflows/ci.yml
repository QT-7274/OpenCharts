name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # api-type-contract-repair.TYPECHECK_GATE.3
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
